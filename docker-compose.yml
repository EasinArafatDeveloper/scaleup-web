# ScaleUp Web on the home server.
# Public traffic comes in through the existing Cloudflare tunnel ("home-server"):
# its cloudflared container reaches this site at http://scaleup-web:3000 over a
# shared Docker network — set TUNNEL_NETWORK to that network's name (see DEPLOY.md).
# Portainer: Stacks → Add stack → Repository. CLI: `docker compose up -d --build`.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://scaleupweb.xyz}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    image: scaleup-web:latest
    container_name: scaleup-web
    restart: unless-stopped
    environment:
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@scaleupweb.xyz}
    networks:
      - default
      - tunnel
    # Only for testing from the server itself: http://localhost:3100
    ports:
      - "127.0.0.1:3100:3000"

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:?Set TUNNEL_NETWORK to the Docker network of your cloudflared container (see DEPLOY.md)}
