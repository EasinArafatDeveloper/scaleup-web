# ScaleUp Web on the home server (see ~/server/PROJECTS.md)
# - website on 127.0.0.1:3006 (this PC only); public through Cloudflare Tunnel "home-server"
#   as http://scaleup-web:3000 (scaleupweb.xyz and www.scaleupweb.xyz)
# - no database
# - settings in ./.env (chmod 600, never committed) — see .env.example
# Update: git pull && docker compose up -d --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://scaleupweb.xyz}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    image: scaleup-web
    container_name: scaleup-web
    environment:
      TZ: Asia/Dhaka
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@scaleupweb.xyz}
    ports: ["127.0.0.1:3006:3000"]
    restart: unless-stopped
    networks: [proxy]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  proxy:
    external: true  # shared with cloudflared: the tunnel reaches this app as http://scaleup-web:3000
